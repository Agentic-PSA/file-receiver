version: "3.8"

services:
  file-receiver:
    build: .
    container_name: bluebox-file-receiver
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - STORAGE_ROOT=/data/files
      - FILE_RECEIVER_API_KEY=${FILE_RECEIVER_API_KEY}
      - MAX_FILE_SIZE_MB=500
    volumes:
      - file-storage:/data/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  file-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_STORAGE_PATH:-/srv/bluebox/files}
